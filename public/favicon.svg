<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background / Border Glow & Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#ffb703" />
    </linearGradient>

    <linearGradient id="gemGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="gemGradCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="gemGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#16102b" stroke="#2a1a52" stroke-width="4" filter="url(#dropGlow)" />
  <rect x="10" y="10" width="108" height="108" rx="24" fill="url(#bgGrad)" opacity="0.15" />

  <!-- Outer Crystal Crest Badge -->
  <polygon points="64,16 106,42 106,86 64,112 22,86 22,42" fill="#1e133a" stroke="#16102b" stroke-width="6" stroke-linejoin="round" />

  <!-- Crossed Swords (Backdrop of Gem) -->
  <g stroke="#16102b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sword 1 -->
    <path d="M34,94 L94,34" stroke="#ffffff" stroke-width="6" />
    <path d="M86,30 L98,42" stroke="url(#goldGrad)" stroke-width="5" />
    <path d="M30,90 L38,98" stroke="url(#goldGrad)" stroke-width="6" />
    <circle cx="28" cy="100" r="4" fill="#f59e0b" stroke="#16102b" stroke-width="2" />

    <!-- Sword 2 -->
    <path d="M94,94 L34,34" stroke="#ffffff" stroke-width="6" />
    <path d="M42,30 L30,42" stroke="url(#goldGrad)" stroke-width="5" />
    <path d="M98,90 L90,98" stroke="url(#goldGrad)" stroke-width="6" />
    <circle cx="100" cy="100" r="4" fill="#f59e0b" stroke="#16102b" stroke-width="2" />
  </g>

  <!-- Central Multi-Faceted Crystal Gem -->
  <!-- Upper table & facets -->
  <polygon points="64,28 88,46 64,56 40,46" fill="url(#gemGradTop)" stroke="#16102b" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Left upper facet -->
  <polygon points="40,46 64,56 46,78 30,58" fill="#00f2fe" stroke="#16102b" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Right upper facet -->
  <polygon points="88,46 64,56 82,78 98,58" fill="url(#gemGradRight)" stroke="#16102b" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Center main facet -->
  <polygon points="64,56 82,78 64,102 46,78" fill="url(#gemGradCenter)" stroke="#16102b" stroke-width="4" stroke-linejoin="round" />

  <!-- Left Lower facet -->
  <polygon points="46,78 64,102 36,86" fill="#0284c7" stroke="#16102b" stroke-width="3" stroke-linejoin="round" />

  <!-- Right Lower facet -->
  <polygon points="82,78 64,102 92,86" fill="#6d28d9" stroke="#16102b" stroke-width="3" stroke-linejoin="round" />

  <!-- Highlights & Sparkles -->
  <polygon points="64,32 78,44 64,48 50,44" fill="#ffffff" opacity="0.7" />
  <path d="M52,62 L58,74 L52,70 Z" fill="#ffffff" opacity="0.6" />

  <!-- Star Sparkle Top Right -->
  <g fill="#fef08a" stroke="#16102b" stroke-width="1.5">
    <path d="M96,22 Q96,28 102,28 Q96,28 96,34 Q96,28 90,28 Q96,28 96,22 Z" />
  </g>

  <!-- Small Sparkle Bottom Left -->
  <g fill="#67e8f9" stroke="#16102b" stroke-width="1">
    <path d="M26,72 Q26,76 30,76 Q26,76 26,80 Q26,76 22,76 Q26,76 26,72 Z" />
  </g>
</svg>
